<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>

  <main class="login-wrap">
    <div class="login-card glass">
      <a class="brand" href="/admin"><span>&lt;</span>Admin<span>/&gt;</span></a>
      <p class="sub">Sign in to manage your portfolio</p>

      <div class="form-error" id="formError" role="alert" hidden></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required>
        </div>
        <button class="btn primary" id="loginBtn" type="submit">Log in →</button>
      </form>

      <p class="sub"><a href="/">← Back to website</a></p>
    </div>
  </main>

  <script src="/admin/assets/common.js"></script>
  <script src="/admin/assets/login.js"></script>
</body>
</html>
